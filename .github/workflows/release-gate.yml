name: Release Gate

# Source/DB pre-stage gate. Production domain authority remains exclusively in
# production-release.yml, which certifies and promotes an exact deployment URL.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  release-gate:
    name: Release pre-stage gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:migration-manifest
      - run: pnpm verify:release-lineage --require-clean
      - name: App generation, migration floor, backup and build identity
        env:
          RELEASE_GATE_MODE: release
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EXPECTED_RELEASE_SHA: ${{ github.sha }}
          BACKUP_MAX_AGE_HOURS: "48"
        run: pnpm verify:release-gate
