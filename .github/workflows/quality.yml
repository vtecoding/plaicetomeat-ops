name: Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # PTM Engineering Constitution — the static architectural invariants (truth,
      # firewalls, route protection, owner-brain compliance, …). These guards already
      # existed; this gate makes them enforced on every PR instead of run by hand. DB-
      # and app-dependent guards run in database-security.yml / application-e2e.yml.
      - name: Architecture invariants (static tier)
        run: pnpm architecture:check
      - run: pnpm build
      - run: pnpm audit:bundle -- --dry-run
