name: Database Security

on:
  pull_request:
  push:
    branches: [main]

jobs:
  database-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: npx supabase start
      - name: Write local Supabase env
        run: |
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0"
            echo "SUPABASE_SERVICE_ROLE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU"
          } > .env.local
      - run: node scripts/seed-dev.mjs
      - run: pnpm architecture:check -- --tier=db
      - run: node scripts/verify-public-access.mjs
      - run: node scripts/verify-audit-authenticity.mjs
      - run: node scripts/verify-ops.mjs
      - run: node scripts/verify-ops-capture.mjs
      - name: V18 truth and replay gates
        run: |
          node scripts/ensure-test-shop-day-open.mjs
          corepack pnpm verify:payment-truth
          # payment-truth isolates and cleans up its own opening/closing cases;
          # restore the trading precondition for the remaining writer verifiers.
          node scripts/ensure-test-shop-day-open.mjs
          corepack pnpm verify:inventory-policy
          corepack pnpm verify:untracked-isolation
          corepack pnpm verify:refund-truth
          corepack pnpm verify:order-corrections
          corepack pnpm verify:order-correction-concurrency
          corepack pnpm verify:amendment-depletion
          corepack pnpm verify:atomic-operator-serve
          corepack pnpm verify:operator-run-completion
          corepack pnpm verify:atomic-evidence
          corepack pnpm verify:operator-drafts
          corepack pnpm verify:alert-dispatch
          corepack pnpm verify:owner-jobs
          corepack pnpm verify:owner-away
          corepack pnpm verify:shortfall-owner-alert
          corepack pnpm verify:required-compliance
          corepack pnpm verify:owner-alert-worker-runtime
