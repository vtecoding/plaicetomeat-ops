name: Migration Upgrade

on:
  pull_request:
  push:
    branches: [main]

jobs:
  migration-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: npx supabase start
      - name: Write local Supabase env
        run: |
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0"
            echo "SUPABASE_SERVICE_ROLE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU"
            echo "STAFF_SESSION_SECRET=ci-local-staff-session-secret-000000000001"
            echo "ORDER_ACCESS_SECRET=ci-local-order-access-secret-000000000001"
          } > .env.local
      - run: node scripts/seed-dev.mjs
      - run: node scripts/verify-v11-migrations.mjs
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm playwright:smoke
        env:
          PLAYWRIGHT_RETRIES: "0"
          PLAYWRIGHT_SKIP_BUILD: "true"
